<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="movingGridHero" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#111C33" stroke-width="0.9"/>
      <circle cx="0" cy="0" r="1.4" fill="#0047FF" opacity="0.65"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="2.8s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="cobaltPlasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0047FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="limePlasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cobaltLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047FF"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0047FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#CCFF00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0047FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hudClip">
      <polygon points="28,2 1172,2 1198,28 1198,372 1172,398 28,398 2,372 2,28"/>
    </clipPath>
  </defs>

  <style>
    .scan { animation: scanY 4.5s ease-in-out infinite; }
    .pulse { animation: blink 1.6s ease-in-out infinite; }
    .spark1 { animation: rise 3.4s linear infinite; }
    .spark2 { animation: rise 4.6s linear 1.1s infinite; }
    .spark3 { animation: rise 3.0s linear 0.5s infinite; }
    .spark4 { animation: rise 4.1s linear 1.8s infinite; }
    .spark5 { animation: rise 3.7s linear 2.3s infinite; }
    @keyframes scanY { 0%, 100% { transform: translateY(-80px); } 50% { transform: translateY(400px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes rise {
      0% { transform: translateY(410px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(-20px); opacity: 0; }
    }
  </style>

  <polygon points="28,2 1172,2 1198,28 1198,372 1172,398 28,398 2,372 2,28" fill="#050508" stroke="#1E293B" stroke-width="2"/>

  <g clip-path="url(#hudClip)">
    <circle r="300" fill="url(#cobaltPlasma)">
      <animate attributeName="cx" values="200;880;200" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;320;80" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="240" fill="url(#limePlasma)">
      <animate attributeName="cx" values="1020;320;1020" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="310;90;310" dur="11s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="400" fill="url(#movingGridHero)"/>
    <rect x="0" y="0" width="1200" height="72" fill="url(#scanBeam)" class="scan"/>
    <rect x="140" y="0" width="3" height="14" rx="1.5" fill="#CCFF00" class="spark1"/>
    <rect x="390" y="0" width="3" height="18" rx="1.5" fill="#0047FF" class="spark2"/>
    <rect x="640" y="0" width="3" height="12" rx="1.5" fill="#CCFF00" class="spark3"/>
    <rect x="810" y="0" width="3" height="16" rx="1.5" fill="#0047FF" class="spark4"/>
    <rect x="1120" y="0" width="3" height="14" rx="1.5" fill="#CCFF00" class="spark5"/>
  </g>

  <polyline points="2,64 2,28 28,2 84,2" stroke="#CCFF00" stroke-width="3" fill="none"/>
  <polyline points="1198,336 1198,372 1172,398 1116,398" stroke="#0047FF" stroke-width="3" fill="none"/>

  <rect x="64" y="54" width="10" height="10" fill="#CCFF00" class="pulse"/>
  <text x="86" y="63" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#CCFF00" letter-spacing="3">SYS.ID // ARAVIND23005370 — CHENNAI, INDIA</text>

  <text x="60" y="162" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" letter-spacing="4">ARAVIND R</text>
  <rect x="64" y="182" width="440" height="3" fill="url(#cobaltLime)"/>

  <text x="64" y="220" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#60A5FA" letter-spacing="2">FULL-STACK &amp; AGENTIC AI ENGINEER</text>
  <text x="64" y="252" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">B.Tech AI &amp; Data Science • Former Full-Stack Intern @ ApproTech.</text>
  <text x="64" y="274" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">Building secure Java/Spring Boot backends, React.js apps, and intelligent AI automation.</text>

  <line x1="64" y1="312" x2="740" y2="312" stroke="#1E293B" stroke-width="1"/>
  <text x="64" y="338" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">CORE STACK</text>
  <text x="64" y="360" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#FFFFFF">JAVA • SPRING BOOT • REACT</text>

  <text x="345" y="338" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">AI &amp; CLOUD</text>
  <text x="345" y="360" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#FFFFFF">LANGGRAPH • DOCKER • AWS</text>

  <text x="615" y="338" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">STATUS</text>
  <text x="615" y="360" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#CCFF00">OPEN TO SWE</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 960 200" to="360 960 200" dur="22s" repeatCount="indefinite"/>
    <polygon points="960,82 1062,141 1062,259 960,318 858,259 858,141" fill="none" stroke="#0047FF" stroke-width="2.2" stroke-dasharray="18 10"/>
    <circle cx="960" cy="82" r="5.5" fill="#CCFF00"/>
    <circle cx="960" cy="318" r="5.5" fill="#0047FF"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 960 200" to="0 960 200" dur="13s" repeatCount="indefinite"/>
    <polygon points="960,122 1028,161 1028,239 960,278 892,239 892,161" fill="#050814" fill-opacity="0.75" stroke="#CCFF00" stroke-width="1.8"/>
  </g>
  <text x="960" y="208" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="22" font-weight="900" fill="#CCFF00" text-anchor="middle">&lt;AR/&gt;</text>
</svg>
