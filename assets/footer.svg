<svg width="1200" height="130" viewBox="0 0 1200 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="movingGridFoot" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#111C33" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.2" fill="#0047FF" opacity="0.55"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 28" dur="3s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="footLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047FF"/>
      <stop offset="50%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#0047FF"/>
    </linearGradient>
    <clipPath id="fClip">
      <polygon points="18,2 1182,2 1198,18 1198,112 1182,128 18,128 2,112 2,18"/>
    </clipPath>
  </defs>

  <style>
    .pulse { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  </style>

  <polygon points="18,2 1182,2 1198,18 1198,112 1182,128 18,128 2,112 2,18" fill="#050508" stroke="#1E293B" stroke-width="2"/>
  <g clip-path="url(#fClip)">
    <rect width="1200" height="130" fill="url(#movingGridFoot)"/>
  </g>
  <rect x="44" y="2" width="1112" height="3" fill="url(#footLine)"/>

  <circle cx="56" cy="52" r="5" fill="#CCFF00" class="pulse"/>
