<svg width="600" height="460" viewBox="0 0 600 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="movingGridMob" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#111C33" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.2" fill="#0047FF" opacity="0.6"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 28" dur="2.8s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="cPlasmaM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0047FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lPlasmaM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cLineM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047FF"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
    <clipPath id="hudClipM">
      <polygon points="22,2 578,2 598,22 598,438 578,458 22,458 2,438 2,22"/>
    </clipPath>
  </defs>

  <style>
    .pulse { animation: blink 1.6s ease-in-out infinite; }
