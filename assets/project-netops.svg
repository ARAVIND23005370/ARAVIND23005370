<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid_netops" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#111C33" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.2" fill="#0047FF" opacity="0.55"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 28" dur="3s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="c_netops" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0047FF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l_netops" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip_netops">
      <polygon points="22,2 1178,2 1198,22 1198,228 1178,248 22,248 2,228 2,22"/>
    </clipPath>
  </defs>

  <style>
    .wire { stroke: #CCFF00; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 0.9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
  </style>

  <polygon points="22,2 1178,2 1198,22 1198,228 1178,248 22,248 2,228 2,22" fill="#050508" stroke="#1E293B" stroke-width="2"/>
  <g clip-path="url(#clip_netops)">
    <circle r="220" fill="url(#c_netops)">
      <animate attributeName="cx" values="980;220;980" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="125;125;125" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="180" fill="url(#l_netops)">
      <animate attributeName="cx" values="180;1020;180" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;60;190" dur="15s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="250" fill="url(#grid_netops)"/>
  </g>

  <polyline points="2,50 2,22 22,2 64,2" stroke="#CCFF00" stroke-width="3" fill="none"/>
  <polyline points="1198,200 1198,228 1178,248 1136,248" stroke="#0047FF" stroke-width="3" fill="none"/>

  <text x="48" y="46" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#60A5FA" letter-spacing="2">PROJECT 03 // AGENTIC AI • IN DEVELOPMENT</text>
  <text x="48" y="92" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="31" font-weight="900" fill="#FFFFFF" letter-spacing="1">NETOPS AI TELECOM PLATFORM</text>
  <text x="48" y="128" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">Agentic AI platform for telecom network anomaly detection and alert correlation.</text>
  <text x="48" y="150" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">Evidence-driven root cause analysis via LangGraph, RAG, and human remediation.</text>

  <rect x="48" y="186" width="66" height="28" rx="4" fill="#080D1F" stroke="#0047FF"/>
  <text x="81.0" y="204" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PYTHON</text>
  <rect x="122" y="186" width="74" height="28" rx="4" fill="#080D1F" stroke="#0047FF"/>
  <text x="159.0" y="204" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">FASTAPI</text>
  <rect x="204" y="186" width="90" height="28" rx="4" fill="#080D1F" stroke="#0047FF"/>
  <text x="249.0" y="204" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">LANGGRAPH</text>
  <rect x="302" y="186" width="58" height="28" rx="4" fill="#080D1F" stroke="#0047FF"/>
  <text x="331.0" y="204" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">RAG</text>
  <rect x="368" y="186" width="98" height="28" rx="4" fill="#080D1F" stroke="#0047FF"/>
  <text x="417.0" y="204" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">POSTGRESQL</text>
  <rect x="474" y="186" width="58" height="28" rx="4" fill="#080D1F" stroke="#CCFF00"/>
  <text x="503.0" y="204" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">REACT</text>

  <line x1="650" y1="30" x2="650" y2="220" stroke="#1E293B" stroke-width="1.5"/>

  <line x1="785" y1="125" x2="870" y2="75" class="wire"/>
  <line x1="785" y1="125" x2="870" y2="175" class="wire"/>
  <line x1="1005" y1="75" x2="1065" y2="125" class="wire"/>
  <line x1="1005" y1="175" x2="1065" y2="125" class="wire"/>

  <rect x="685" y="103" width="100" height="44" rx="6" fill="#080D1F" stroke="#CCFF00" stroke-width="1.5"/>
  <text x="735" y="129" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">TELEMETRY</text>

  <rect x="870" y="53" width="135" height="44" rx="6" fill="#080D1F" stroke="#0047FF" stroke-width="1.5"/>
  <text x="937.5" y="79" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">ANOMALY ML</text>

  <rect x="870" y="153" width="135" height="44" rx="6" fill="#080D1F" stroke="#0047FF" stroke-width="1.5"/>
  <text x="937.5" y="179" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">LANGGRAPH RAG</text>

  <rect x="1065" y="103" width="100" height="44" rx="6" fill="#080D1F" stroke="#CCFF00" stroke-width="1.5"/>
  <text x="1115" y="129" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">REMEDIATE</text>
</svg>
